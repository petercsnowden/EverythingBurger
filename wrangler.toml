name = "everything-burger"
main = "backend/worker/index.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]


[assets]
directory = "dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

html_handling = "none"


[vars]
PUBLIC_BASE_URL = "https://everythingburger.studio"
routes = [{ pattern = "everythingburger.studio", custom_domain = true }]
CURRENCY = "usd"
SHIPPING_CENTS = "800"
MAX_QTY_PER_LINE = "20"
MAX_CART_LINES = "30"
ALLOWED_SHIPPING_COUNTRIES = "US,CA"
