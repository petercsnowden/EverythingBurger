<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Everything Burger — 3D Experience</title>
<style>
  :root {
    --accent: #ff6031;
    --sky: #95D4F0;
    --ink: #00000060;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--ink);
    overflow: hidden;
    font-family: "Averia Serif Libre";
  }
  canvas { display: block; }

  #crosshair {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 6px;
    height: 6px;
    margin: -3px 0 0 -3px;
    border-radius: 50%;
    background: #fff;
    mix-blend-mode: difference;
    pointer-events: none;
    opacity: 0;
    transition: opacity .2s ease;
    z-index: 5;
  }
  #crosshair.visible { opacity: 0.9; }

  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--ink);
    z-index: 10;
    cursor: pointer;
    transition: opacity .35s ease;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }

  #overlay-card {
    text-align: center;
    color: #fff;
    max-width: 360px;
    padding: 0 24px;
  }
  #overlay-card h1 {
    font-size: 28px;
    margin: 0 0 12px;
    color: var(--accent);
    letter-spacing: -0.02em;
  }
  #overlay-card p {
    font-size: 15px;
    line-height: 1.5;
    margin: 6px 0;
    color: #ffffff;
  }
  #overlay-card .key {
    display: inline-block;
    padding: 2px 7px;
    border: 1px solid #555;
    border-radius: 4px;
    font-size: 13px;
    color: #fff;
    margin: 0 2px;
  }
  #enter-btn {
    margin-top: 22px;
    padding: 12px 28px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 999px;
    font-size: 30px;
    font-weight: 600;
    cursor: pointer;
    font-family: "Damsterdam"
  }
  #back-link {
    position: fixed;
    top: 18px;
    left: 18px;
    z-index: 8;
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    background: rgba(0,0,0,0.45);
    padding: 8px 14px;
    border-radius: 999px;
    backdrop-filter: blur(4px);
    opacity: 0;
    transition: opacity .3s ease;
  }
  #back-link.visible { opacity: 1; }

  #loading-bar-wrap {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    height: 3px;
    background: rgba(255,255,255,0.15);
    border-radius: 2px;
    overflow: hidden;
    z-index: 10;
  }
  #loading-bar {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width .2s ease;
  }
  #loading-label {
    position: fixed;
    bottom: 54px;
    left: 50%;
    transform: translateX(-50%);
    color: #888;
    font-size: 12px;
    z-index: 10;
  }

  #reset-hint {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.55);
    font-size: 12px;
    z-index: 8;
    opacity: 0;
    transition: opacity .3s ease;
  }
  #reset-hint.visible { opacity: 1; }

  /* ---------- Mobile touch controls ---------- */
  #joystick-zone {
    position: fixed; bottom: 30px; left: 30px;
    width: 120px; height: 120px;
    z-index: 6; display: none;
    touch-action: none;
  }
  #joystick-zone.visible { display: block; }
  #joystick-base {
    position: absolute; inset: 0;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
  }
  #joystick-knob {
    position: absolute;
    width: 50px; height: 50px;
    left: 35px; top: 35px;
    border-radius: 50%;
    background: rgba(255,255,255,0.55);
    pointer-events: none;
  }
  #look-zone {
    position: fixed; inset: 0;
    z-index: 4; display: none;
    touch-action: none;
  }
  #look-zone.visible { display: block; }
  #jump-btn {
    position: fixed; bottom: 40px; right: 30px;
    width: 70px; height: 70px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.4);
    color: #fff; font-size: 13px;
    z-index: 6; display: none;
    touch-action: none;
  }
  #jump-btn.visible { display: block; }

  .lil-gui {
    --width: 280px;
    z-index: 30 !important;
    max-height: min(78vh, 720px);
    overflow: auto;
  }
  .lil-gui.root {
    position: fixed !important;
    top: 12px;
    right: 12px;
  }
</style>
</head>
<body>

<a id="back-link" href="../index.html">&larr; Back</a>
<div id="crosshair"></div>
<div id="loading-label">Loading environment…</div>
<div id="loading-bar-wrap"><div id="loading-bar"></div></div>
<div id="reset-hint">Stuck? Press <b style="color:#fff">R</b> to reset your position</div>

<div id="look-zone"></div>
<div id="joystick-zone">
  <div id="joystick-base"></div>
  <div id="joystick-knob"></div>
</div>
<button id="jump-btn">JUMP</button>

<div id="overlay">
  <div id="overlay-card">
    <p>Move with <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span></p>
    <p>Look around with your mouse &middot; <span class="key">Space</span> to jump</p>
    <p>Press <span class="key">Esc</span> anytime to get your cursor back</p>
    <button id="enter-btn">Enter</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "three-mesh-bvh": "https://unpkg.com/three-mesh-bvh@0.9.14/build/index.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
import { Sky } from 'three/addons/objects/Sky.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { SSAOPass } from 'three/addons/postprocessing/SSAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { LUTPass } from 'three/addons/postprocessing/LUTPass.js';
import { LUTCubeLoader } from 'three/addons/loaders/LUTCubeLoader.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
import {
  MeshBVH,
  StaticGeometryGenerator,
  computeBoundsTree,
  disposeBoundsTree,
  acceleratedRaycast
} from 'three-mesh-bvh';

THREE.BufferGeometry.prototype.computeBoundsTree = computeBoundsTree;
THREE.BufferGeometry.prototype.disposeBoundsTree = disposeBoundsTree;
THREE.Mesh.prototype.raycast = acceleratedRaycast;

// ---------- CONFIG ----------
const MODEL_URL = '../assets/3d%20models/museumd2-optimized.glb';

// Where the player starts. Set well above the floor and let gravity +
// collision drop them onto real geometry — safer than guessing an exact
// floor height. Adjust x/z to taste; the model's main room sits roughly
// around x=-50, z=-3 in the source file.
const SPAWN_POSITION = new THREE.Vector3(-55, 15, -4);

// Objects that should collide (block the player) but never be rendered —
// e.g. an invisible perimeter wall. Set AFTER the collision mesh is built
// below, so the collider still bakes in their geometry; only their visual
// rendering is turned off.
const HIDDEN_COLLIDER_NAMES = ['plane021'];

const WALK_SPEED = 6.4;       // meters/second
const SPRINT_MULT = 1.8;
const CAPSULE_RADIUS = 0.35;
const CAPSULE_HEIGHT = 2.1;   // feet to top of head
const GRAVITY = 22;
const JUMP_SPEED = 7.2;
const STEP_HEIGHT = 0.3;      // max stair-riser height the player auto-climbs
// -----------------------------

const overlay = document.getElementById('overlay');
const enterBtn = document.getElementById('enter-btn');
const crosshair = document.getElementById('crosshair');
const backLink = document.getElementById('back-link');
const resetHint = document.getElementById('reset-hint');
const loadingBar = document.getElementById('loading-bar');
const loadingLabel = document.getElementById('loading-label');
const loadingWrap = document.getElementById('loading-bar-wrap');
const joystickZone = document.getElementById('joystick-zone');
const joystickKnob = document.getElementById('joystick-knob');
const lookZone = document.getElementById('look-zone');
const jumpBtn = document.getElementById('jump-btn');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.Fog(0x000000, 30, 50000);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 10000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap; // softer shadow edges
document.body.appendChild(renderer.domElement);

const isLikelyMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

const pmremGenerator = new THREE.PMREMGenerator(renderer);

const hemiLight = new THREE.HemisphereLight(0xbdd7ff, 0x2a2a2a, 1.1);
scene.add(hemiLight);

const sun = new THREE.DirectionalLight(0xffffff, 1.7);
sun.position.set(8, 10, 6);
sun.castShadow = true; // NOTE: this was never set before, so no shadows were
                        // actually being cast despite shadowMap being enabled
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0003;
sun.shadow.normalBias = 0.02;
// Shadow camera frustum — an orthographic box covering the lit area of the
// model. Widen/lengthen this (and near/far) if shadows clip near your walls.
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 80;
sun.shadow.camera.left = -40;
sun.shadow.camera.right = 40;
sun.shadow.camera.top = 40;
sun.shadow.camera.bottom = -40;
scene.add(sun);

// A DirectionalLight's shadow frustum is centered on its TARGET, which
// defaults to world origin (0,0,0) — not wherever your model actually sits.
// This model's real geometry is roughly 30-70 units away from the origin, so
// without this, the shadow camera was pointed at empty space and nothing
// was ever actually receiving a shadow. Aim it at the player's spawn area
// instead — that's where shadows actually matter.
sun.target.position.set(SPAWN_POSITION.x, 0, SPAWN_POSITION.z);
scene.add(sun.target);

// Soft, non-shadow-casting fill light from the opposite side, so the sun
// isn't the only thing carving out contrast — keeps shadowed areas from
// going flat black without costing another shadow map.
const fill = new THREE.DirectionalLight(0xcfe0ff, 0.5);
fill.position.set(-10, 6, -8);
scene.add(fill);

// ---------- Sky background + matching environment lighting ----------
// Baked once into a texture used for both the visible background and the
// IBL environment (ambient light + reflections), instead of adding an actual
// giant sky mesh into the live scene. A real sky mesh needs to be huge
// (hundreds of thousands of units) to look right, which would force the
// camera's far plane out to match — reintroducing exactly the depth-precision
// problem the near/far change above just fixed. Baking it offscreen avoids
// that entirely: the bake uses its own separate camera range that never
// touches the one your main scene renders with.
const skyProbeScene = new THREE.Scene();
const sky = new Sky();
sky.scale.setScalar(1000);
skyProbeScene.add(sky);

// Match the visible sky's sun direction to the DirectionalLight above so the
// shadows and the sky's bright spot agree with each other.
const sunDirection = sun.position.clone().normalize();
sky.material.uniforms['sunPosition'].value.copy(sunDirection);
sky.material.uniforms['turbidity'].value = .3;      // haze amount
sky.material.uniforms['rayleigh'].value = 0;      // blue intensity
sky.material.uniforms['mieCoefficient'].value = 0.006;
sky.material.uniforms['mieDirectionalG'].value = 0.8; // sun glare size

let skyEnvRT = pmremGenerator.fromScene(skyProbeScene, 0, 1, 5000);
scene.environment = skyEnvRT.texture;
scene.background = skyEnvRT.texture;

const collisionObject = scene.getObjectByName('plane021');

if (collisionObject) {
    collisionObject.visible = false;

    // Keep using collisionObject for your collision calculations.
}

// Fog now fades toward the sky's horizon color instead of black, so distant
// geometry blends into the sky instead of vanishing into a dark wall.
scene.fog.color.set(0xbfd9ea);

// ---------- Positional audio ----------
const listener = new THREE.AudioListener();
camera.add(listener);

const sound = new THREE.PositionalAudio(listener);
const audioLoader = new THREE.AudioLoader();
audioLoader.load('../../3d/jazz.mp3', (buffer) => {
  sound.setBuffer(buffer);
  sound.setDistanceModel('linear');
  sound.setRefDistance(10);
  sound.setMaxDistance(20);
  sound.setRolloffFactor(1);
  sound.setLoop(true);
  sound.play();
});
sound.position.set(-55, 15, -4);
scene.add(sound);

const MasterPostShader = {
  uniforms: {
    tDiffuse: { value: null },
    time: { value: 0.0 },
    resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
    vignetteEnabled: { value: true },
    vignetteOffset: { value: 1.0 },
    vignetteDarkness: { value: 1.2 },
    grainEnabled: { value: true },
    grainIntensity: { value: 0.03 },
    tiltShiftEnabled: { value: false },
    focusY: { value: 0.5 },
    focusWidth: { value: 0.35 },
    blurAmount: { value: 2.0 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );
    }
  `,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float time;
    uniform vec2 resolution;
    uniform bool vignetteEnabled;
    uniform float vignetteOffset;
    uniform float vignetteDarkness;
    uniform bool grainEnabled;
    uniform float grainIntensity;
    uniform bool tiltShiftEnabled;
    uniform float focusY;
    uniform float focusWidth;
    uniform float blurAmount;
    varying vec2 vUv;

    float rand( vec2 co ) {
      return fract( sin( dot( co.xy, vec2( 12.9898, 78.233 ) ) ) * 43758.5453 );
    }

    void main() {
      vec2 texelSize = 1.0 / resolution;
      vec4 color;

      if ( tiltShiftEnabled && blurAmount > 0.0 ) {
        float dist = abs( vUv.y - focusY );
        float blur = smoothstep( 0.0, focusWidth, dist ) * blurAmount;
        vec4 sum = vec4( 0.0 );
        float total = 0.0;
        for ( float i = -2.0; i <= 2.0; i++ ) {
          float weight = 1.0 - abs( i ) / 2.0;
          vec2 offset = vec2( 0.0, i * blur * texelSize.y );
          sum += texture2D( tDiffuse, vUv + offset ) * weight;
          total += weight;
        }
        for ( float i = -2.0; i <= 2.0; i++ ) {
          float weight = 1.0 - abs( i ) / 2.0;
          vec2 offset = vec2( i * blur * texelSize.x * 0.5, 0.0 );
          sum += texture2D( tDiffuse, vUv + offset ) * weight;
          total += weight;
        }
        color = sum / total;
      } else {
        color = texture2D( tDiffuse, vUv );
      }

      if ( grainEnabled && grainIntensity > 0.0 ) {
        float grain = rand( vUv + fract( time ) ) * 2.0 - 1.0;
        color.rgb += grain * grainIntensity;
      }

      if ( vignetteEnabled ) {
        vec2 uv = ( vUv - vec2( 0.5 ) ) * vec2( vignetteOffset );
        float vignette = 1.0 - dot( uv, uv );
        vignette = clamp( pow( vignette, vignetteDarkness ), 0.0, 1.0 );
        color.rgb *= vignette;
      }

      gl_FragColor = color;
    }
  `
};

const GodRaysShader = {
  uniforms: {
    tDiffuse: { value: null },
    sunPosition: { value: new THREE.Vector2(0.5, 0.5) },
    decay: { value: 0.968 },
    density: { value: 1.0 },
    weight: { value: 0.56 },
    exposure: { value: 0.52 },
    strength: { value: 0.0 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );
    }
  `,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform vec2 sunPosition;
    uniform float decay;
    uniform float density;
    uniform float weight;
    uniform float exposure;
    uniform float strength;
    varying vec2 vUv;
    void main() {
      vec4 origC = texture2D( tDiffuse, vUv );
      if ( strength < 0.001 ) {
        gl_FragColor = origC;
      } else {
        vec3 orig = origC.rgb;
        vec2 delta = ( vUv - sunPosition ) * density * ( 1.0 / 32.0 );
        vec3 scatter = vec3( 0.0 );
        vec2 coord = vUv;
        float illum = 1.0;
        for ( int i = 0; i < 32; i++ ) {
          coord -= delta;
          vec2 c = clamp( coord, vec2( 0.002 ), vec2( 0.998 ) );
          vec3 s = texture2D( tDiffuse, c ).rgb;
          float lum = dot( s, vec3( 0.2126, 0.7152, 0.0722 ) );
          scatter += s * illum * weight * smoothstep( 0.01, 0.92, lum );
          illum *= decay;
        }
        vec3 outRgb = orig + scatter * exposure * strength;
        gl_FragColor = vec4( outRgb, origC.a );
      }
    }
  `
};

const defaultPostProcessingSettings = {
  postEnabled: true,
  ssaoEnabled: !isLikelyMobile,
  ssaoKernelRadius: 0.1,
  ssaoMinDistance: 0.0005,
  ssaoMaxDistance: 0.05,
  bloomEnabled: !isLikelyMobile,
  bloomStrength: 0.2,
  bloomRadius: 1,
  bloomThreshold: 1,
  filmEnabled: true,
  filmNoiseIntensity: 0.03,
  vignetteEnabled: true,
  vignetteOffset: 1.0,
  vignetteDarkness: 1.2,
  tiltShiftEnabled: false,
  tiltShiftFocusY: 0.5,
  tiltShiftFocusWidth: 0.35,
  tiltShiftBlurAmount: 2.0,
  lutEnabled: true,
  lutIntensity: 1,
  godRaysEnabled: false,
  godRaysStrength: 1.35,
  godRaysDecay: 0.968,
  godRaysDensity: 1.0,
  godRaysWeight: 0.56,
  godRaysExposure: isLikelyMobile ? 0.36 : 0.52
};

const defaultEnvSettings = {
  envEnabled: true,
  fogEnabled: true,
  fogColor: '#bfd9ea',
  fogNear: 30,
  fogFar: 50000,
  hemiSkyColor: '#bdd7ff',
  hemiGroundColor: '#2a2a2a',
  hemiIntensity: 1.1,
  sunColor: '#ffffff',
  sunIntensity: 1.7,
  sunPosX: 8,
  sunPosY: 10,
  sunPosZ: 6,
  fillColor: '#cfe0ff',
  fillIntensity: 0.5,
  fillPosX: -10,
  fillPosY: 6,
  fillPosZ: -8,
  toneMapping: 'ACESFilmic',
  exposure: 1.05,
  shadowsEnabled: true,
  useSkyIbl: true,
  useSkyBackground: true,
  skyTurbidity: 0.3,
  skyRayleigh: 0,
  skyMieCoefficient: 0.006,
  skyMieDirectionalG: 0.8
};

const toneMappingOptions = {
  None: THREE.NoToneMapping,
  Linear: THREE.LinearToneMapping,
  Reinhard: THREE.ReinhardToneMapping,
  Cineon: THREE.CineonToneMapping,
  ACESFilmic: THREE.ACESFilmicToneMapping
};

function loadPostProcessingSettings() {
  try {
    const saved = localStorage.getItem('postProcessingSettings');
    if (saved) return { ...defaultPostProcessingSettings, ...JSON.parse(saved) };
  } catch (e) {
    console.warn('Failed to load post-processing settings:', e);
  }
  return { ...defaultPostProcessingSettings };
}

const postProcessingSettings = loadPostProcessingSettings();

function savePostProcessingSettings() {
  try {
    localStorage.setItem('postProcessingSettings', JSON.stringify(postProcessingSettings));
  } catch (e) {
    console.warn('Failed to save post-processing settings:', e);
  }
}

function loadEnvSettings() {
  try {
    const saved = localStorage.getItem('envSettings');
    if (saved) return { ...defaultEnvSettings, ...JSON.parse(saved) };
  } catch (e) {
    console.warn('Failed to load environment settings:', e);
  }
  return { ...defaultEnvSettings };
}

const envSettings = loadEnvSettings();

function saveEnvSettings() {
  try {
    localStorage.setItem('envSettings', JSON.stringify(envSettings));
  } catch (e) {
    console.warn('Failed to save environment settings:', e);
  }
}

const composer = new EffectComposer(renderer);
composer.setPixelRatio(renderer.getPixelRatio());
composer.setSize(window.innerWidth, window.innerHeight);
composer.addPass(new RenderPass(scene, camera));

const ssaoPass = new SSAOPass(scene, camera, window.innerWidth, window.innerHeight);
ssaoPass.kernelRadius = postProcessingSettings.ssaoKernelRadius;
ssaoPass.minDistance = postProcessingSettings.ssaoMinDistance;
ssaoPass.maxDistance = postProcessingSettings.ssaoMaxDistance;
ssaoPass.enabled = postProcessingSettings.ssaoEnabled;
composer.addPass(ssaoPass);

const godRaysPass = new ShaderPass(GodRaysShader);
composer.addPass(godRaysPass);

const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  postProcessingSettings.bloomStrength,
  postProcessingSettings.bloomRadius,
  postProcessingSettings.bloomThreshold
);
composer.addPass(bloomPass);

const masterPostPass = new ShaderPass(MasterPostShader);
masterPostPass.uniforms.resolution.value.set(window.innerWidth, window.innerHeight);
composer.addPass(masterPostPass);

let lutPass = null;

function applyPostProcessingSettings() {
  const masterOn = postProcessingSettings.postEnabled;

  ssaoPass.enabled = masterOn && postProcessingSettings.ssaoEnabled;
  ssaoPass.kernelRadius = postProcessingSettings.ssaoKernelRadius;
  ssaoPass.minDistance = postProcessingSettings.ssaoMinDistance;
  ssaoPass.maxDistance = postProcessingSettings.ssaoMaxDistance;

  bloomPass.enabled = masterOn && postProcessingSettings.bloomEnabled;
  bloomPass.strength = postProcessingSettings.bloomStrength;
  bloomPass.radius = postProcessingSettings.bloomRadius;
  bloomPass.threshold = postProcessingSettings.bloomThreshold;

  const grainOn = masterOn && !isLikelyMobile && postProcessingSettings.filmEnabled;
  masterPostPass.enabled = masterOn && (
    postProcessingSettings.filmEnabled
    || postProcessingSettings.vignetteEnabled
    || postProcessingSettings.tiltShiftEnabled
  );
  masterPostPass.uniforms.grainEnabled.value = grainOn;
  masterPostPass.uniforms.grainIntensity.value = grainOn ? postProcessingSettings.filmNoiseIntensity : 0;
  masterPostPass.uniforms.vignetteEnabled.value = masterOn && postProcessingSettings.vignetteEnabled;
  masterPostPass.uniforms.vignetteOffset.value = postProcessingSettings.vignetteOffset;
  masterPostPass.uniforms.vignetteDarkness.value = postProcessingSettings.vignetteDarkness;
  masterPostPass.uniforms.tiltShiftEnabled.value = masterOn && postProcessingSettings.tiltShiftEnabled;
  masterPostPass.uniforms.focusY.value = postProcessingSettings.tiltShiftFocusY;
  masterPostPass.uniforms.focusWidth.value = postProcessingSettings.tiltShiftFocusWidth;
  masterPostPass.uniforms.blurAmount.value = postProcessingSettings.tiltShiftBlurAmount;

  if (lutPass) {
    lutPass.enabled = masterOn && postProcessingSettings.lutEnabled;
    lutPass.intensity = postProcessingSettings.lutIntensity;
  }

  const raysOn = masterOn && postProcessingSettings.godRaysEnabled;
  godRaysPass.enabled = raysOn;
  godRaysPass.uniforms.decay.value = postProcessingSettings.godRaysDecay;
  godRaysPass.uniforms.density.value = postProcessingSettings.godRaysDensity;
  godRaysPass.uniforms.weight.value = postProcessingSettings.godRaysWeight;
  godRaysPass.uniforms.exposure.value = postProcessingSettings.godRaysExposure;
  godRaysPass.uniforms.strength.value = raysOn ? postProcessingSettings.godRaysStrength : 0;
}

function applyEnvSettings() {
  if (!envSettings.envEnabled) {
    scene.fog = null;
    scene.environment = null;
    scene.background = new THREE.Color(0x555555);

    fill.intensity = 0.25;
    fill.position.set(-10, 6, -8);

  }

  renderer.shadowMap.enabled = envSettings.shadowsEnabled;
  renderer.toneMapping = toneMappingOptions[envSettings.toneMapping] ?? THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = envSettings.exposure;

  hemiLight.color.set(envSettings.hemiSkyColor);
  hemiLight.groundColor.set(envSettings.hemiGroundColor);
  hemiLight.intensity = envSettings.hemiIntensity;

  sun.color.set(envSettings.sunColor);
  sun.intensity = envSettings.sunIntensity;
  sun.position.set(envSettings.sunPosX, envSettings.sunPosY, envSettings.sunPosZ);
  sun.castShadow = envSettings.shadowsEnabled;
  sun.target.position.set(SPAWN_POSITION.x, 0, SPAWN_POSITION.z);
  sun.target.updateMatrixWorld();

  fill.color.set(envSettings.fillColor);
  fill.intensity = envSettings.fillIntensity;
  fill.position.set(envSettings.fillPosX, envSettings.fillPosY, envSettings.fillPosZ);

  if (envSettings.fogEnabled) {
    scene.fog = new THREE.Fog(envSettings.fogColor, envSettings.fogNear, envSettings.fogFar);
  } else {
    scene.fog = null;
  }

  if (envSettings.useSkyIbl) {
    scene.environment = skyEnvRT ? skyEnvRT.texture : null;
  } else {
    scene.environment = null;
  }

  if (envSettings.useSkyBackground && skyEnvRT) {
    scene.background = skyEnvRT.texture;
  } else {
    scene.background = new THREE.Color(envSettings.fogColor);
  }
}

// joystickVec: -1..1 on each axis, read by updatePlayer() instead of the
// forward/back/left/right booleans when isLikelyMobile is true.
const joystickVec = { x: 0, y: 0 };
const LOOK_SENSITIVITY = 0.0025;

if (isLikelyMobile) {
  joystickZone.classList.add('visible');
  lookZone.classList.add('visible');
  jumpBtn.classList.add('visible');

  // --- Joystick (movement) ---
  let joystickTouchId = null;
  joystickZone.addEventListener('touchstart', (e) => {
    const t = e.changedTouches[0];
    joystickTouchId = t.identifier;
  }, { passive: true });

  joystickZone.addEventListener('touchmove', (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier !== joystickTouchId) continue;
      const rect = joystickZone.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      let dx = t.clientX - cx;
      let dy = t.clientY - cy;
      const max = rect.width / 2;
      const dist = Math.min(Math.hypot(dx, dy), max);
      const angle = Math.atan2(dy, dx);
      dx = Math.cos(angle) * dist;
      dy = Math.sin(angle) * dist;
      joystickKnob.style.left = (35 + dx) + 'px';
      joystickKnob.style.top = (35 + dy) + 'px';
      joystickVec.x = dx / max;   // -1..1 left/right
      joystickVec.y = dy / max;   // -1..1 forward/back
    }
  }, { passive: true });

  function resetJoystick(e) {
    for (const t of e.changedTouches) {
      if (t.identifier !== joystickTouchId) continue;
      joystickTouchId = null;
      joystickVec.x = 0;
      joystickVec.y = 0;
      joystickKnob.style.left = '35px';
      joystickKnob.style.top = '35px';
    }
  }
  joystickZone.addEventListener('touchend', resetJoystick);
  joystickZone.addEventListener('touchcancel', resetJoystick);

  // --- Drag to look ---
  let lookTouchId = null;
  let lastTouchX = 0, lastTouchY = 0;

  lookZone.addEventListener('touchstart', (e) => {
    const t = e.changedTouches[0];
    lookTouchId = t.identifier;
    lastTouchX = t.clientX;
    lastTouchY = t.clientY;
  }, { passive: true });

  lookZone.addEventListener('touchmove', (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier !== lookTouchId) continue;
      const dx = t.clientX - lastTouchX;
      const dy = t.clientY - lastTouchY;
      lastTouchX = t.clientX;
      lastTouchY = t.clientY;

      // Manually rotate the camera the way PointerLockControls does
      // internally (it won't run without an active pointer lock).
      camera.rotation.order = 'YXZ';
      camera.rotation.y -= dx * LOOK_SENSITIVITY;
      camera.rotation.x -= dy * LOOK_SENSITIVITY;
      camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camera.rotation.x));
    }
  }, { passive: true });

  lookZone.addEventListener('touchend', (e) => {
    for (const t of e.changedTouches) if (t.identifier === lookTouchId) lookTouchId = null;
  });

  // --- Jump ---
  jumpBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    wantsJump = true;
  }, { passive: false });
}

// ---------- Collision resolution ----------
const tempBox = new THREE.Box3();
const tempSegment = new THREE.Line3();
const tempVecA = new THREE.Vector3();
const tempVecB = new THREE.Vector3();
const tempVecC = new THREE.Vector3();

// Read-only probe: how deeply is the capsule currently overlapping geometry,
// at its CURRENT position? Doesn't move anything. Used by the step-up logic
// below to test "would raising the capsule clear this obstruction" without
// committing to it.
function maxPenetrationDepth() {
  if (!collider) return 0;

  tempBox.makeEmpty();
  tempBox.expandByPoint(playerCollider.start);
  tempBox.expandByPoint(playerCollider.end);
  tempBox.min.addScalar(-CAPSULE_RADIUS);
  tempBox.max.addScalar(CAPSULE_RADIUS);

  let deepest = 0;
  collider.geometry.boundsTree.shapecast({
    intersectsBounds: (box) => box.intersectsBox(tempBox),
    intersectsTriangle: (tri) => {
      const distance = tri.closestPointToSegment(playerCollider, tempVecA, tempVecB);
      if (distance < CAPSULE_RADIUS) {
        const depth = CAPSULE_RADIUS - distance;
        if (depth > deepest) deepest = depth;
      }
    }
  });
  return deepest;
}

// Apply horizontal input for this frame, auto-climbing low obstructions
// (stairs, curbs) instead of stopping dead against them. Only kicks in while
// grounded, so it never lets you "step up" through the air.
function applyHorizontalMove(moveVec) {
  if (moveVec.lengthSq() === 0) return;

  playerCollider.start.add(moveVec);
  playerCollider.end.add(moveVec);

  if (!playerOnGround || !collider) return;

  const depthAtCurrentHeight = maxPenetrationDepth();
  if (depthAtCurrentHeight <= 1e-4) return; // wasn't blocked, nothing to do

  // Blocked. Undo, retry the same move from STEP_HEIGHT higher up.
  playerCollider.start.sub(moveVec);
  playerCollider.end.sub(moveVec);
  playerCollider.start.y += STEP_HEIGHT;
  playerCollider.end.y += STEP_HEIGHT;
  playerCollider.start.add(moveVec);
  playerCollider.end.add(moveVec);

  const depthWhenRaised = maxPenetrationDepth();
  if (depthWhenRaised > 1e-4) {
    // Still blocked even up here — a real wall, not a step. Revert fully.
    playerCollider.start.sub(moveVec);
    playerCollider.end.sub(moveVec);
    playerCollider.start.y -= STEP_HEIGHT;
    playerCollider.end.y -= STEP_HEIGHT;
    return;
  }

  // Clear up here — leave the capsule raised. resolveCollisions(), called
  // right after this, will drop it back down onto the step and re-ground it.
}

function resolveCollisions() {
  if (!collider) return;

  let grounded = false;

  // Resolve one penetration at a time, rather than accumulating pushes from
  // every triangle in the model. Accumulating many triangle responses is what
  // causes the player to get "tossed" when meshes contain overlapping faces.
  for (let pass = 0; pass < 5; pass++) {
    tempBox.makeEmpty();
    tempBox.expandByPoint(playerCollider.start);
    tempBox.expandByPoint(playerCollider.end);
    tempBox.min.addScalar(-CAPSULE_RADIUS);
    tempBox.max.addScalar(CAPSULE_RADIUS);

    let deepestDepth = 0;
    let bestNormal = null;

    collider.geometry.boundsTree.shapecast({
      intersectsBounds: (box) => box.intersectsBox(tempBox),

      intersectsTriangle: (tri) => {
        const distance = tri.closestPointToSegment(
          playerCollider,
          tempVecA,
          tempVecB
        );

        if (distance < CAPSULE_RADIUS) {
          const depth = CAPSULE_RADIUS - distance;

          // Normal points from the triangle toward the player (capsule point
          // minus triangle point — NOT the other way around, or every push
          // shoves the player deeper into the surface instead of out of it).
          tempVecC.subVectors(tempVecB, tempVecA);

          let lenSq = tempVecC.lengthSq();

          // At exact contact the closest points can be identical. Use the
          // triangle normal instead of normalizing a zero-length vector.
          if (lenSq < 1e-10) {
            tri.getNormal(tempVecC);
            lenSq = tempVecC.lengthSq();
          }

          if (lenSq > 1e-10 && depth > deepestDepth) {
            tempVecC.multiplyScalar(1 / Math.sqrt(lenSq));
            deepestDepth = depth;
            bestNormal = tempVecC.clone();
          }
        }
      }
    });

    // Ignore sub-millimeter overlaps. Compressed/decimated geometry almost
    // always has tiny gaps or overlaps at seams between separate mesh
    // chunks; resolving those exactly every frame is what produces odd
    // micro-jitter against otherwise-flat walls.
    const MIN_PUSH_DEPTH = 0.0015;
    if (!bestNormal || deepestDepth <= MIN_PUSH_DEPTH) break;

    // Small safety margin prevents immediately re-colliding due to floating
    // point error without creating visible bouncing.
    const push = deepestDepth + 0.0005;
    playerCollider.start.addScaledVector(bestNormal, push);
    playerCollider.end.addScaledVector(bestNormal, push);

    // Remove only velocity INTO the surface. Do not add any velocity from
    // the collision itself, which prevents walls/furniture from launching
    // the player.
    const velocityIntoSurface = playerVelocity.dot(bestNormal);
    if (velocityIntoSurface < 0) {
      playerVelocity.addScaledVector(bestNormal, -velocityIntoSurface);
    }

    // A mostly-upward collision is the floor.
    if (bestNormal.y > 0.55) {
      grounded = true;
      if (playerVelocity.y < 0) playerVelocity.y = 0;
    }
  }

  playerOnGround = grounded;
}

// ---------- Movement loop ----------
const clock = new THREE.Clock();
const forwardVec = new THREE.Vector3();
const rightVec = new THREE.Vector3();
const moveVec = new THREE.Vector3();

function updatePlayer(dt) {
  // Horizontal movement here is driven directly by input (added straight to
  // position below), not by velocity/inertia — playerVelocity should only
  // ever hold vertical (gravity/jump) speed. But resolveCollisions()'s
  // "cancel velocity into the surface" step can leak a bit of x/z into it
  // whenever a floor triangle isn't perfectly flat (always true to some
  // degree on real/compressed geometry). Left unchecked, that leaked
  // velocity gets added to position every frame after and never goes away —
  // that's the slow drift. Clear it before this frame's integration.
  playerVelocity.x = 0;
  playerVelocity.z = 0;

  // Gravity
  if (!playerOnGround) {
    playerVelocity.y -= GRAVITY * dt;
  } else if (playerVelocity.y < 0) {
    playerVelocity.y = 0;
  }
  if (wantsJump && playerOnGround) {
    playerVelocity.y = JUMP_SPEED;
    playerOnGround = false;
  }
  wantsJump = false;

  playerCollider.start.addScaledVector(playerVelocity, dt);
  playerCollider.end.addScaledVector(playerVelocity, dt);

  // Horizontal input, relative to camera yaw
  if (controls.isLocked || isLikelyMobile) {
    const speed = WALK_SPEED * (move.sprint ? SPRINT_MULT : 1);

    camera.getWorldDirection(forwardVec);
    forwardVec.y = 0;
    forwardVec.normalize();
    rightVec.crossVectors(forwardVec, camera.up).normalize();

    moveVec.set(0, 0, 0);

    if (isLikelyMobile) {
      // joystickVec.y: negative = pushed up = forward
      moveVec.addScaledVector(forwardVec, -joystickVec.y);
      moveVec.addScaledVector(rightVec, joystickVec.x);
    } else {
      if (move.forward) moveVec.add(forwardVec);
      if (move.backward) moveVec.sub(forwardVec);
      if (move.right) moveVec.add(rightVec);
      if (move.left) moveVec.sub(rightVec);
    }

    if (moveVec.lengthSq() > 0) moveVec.normalize().multiplyScalar(speed * dt);

    applyHorizontalMove(moveVec);
  }

  // Push the capsule out of any geometry it now overlaps.
  // The resolver also removes velocity directed into the surface, preventing
  // collision normals from turning into launch/toss impulses.
  resolveCollisions();

  // Fell out of the world — send back to spawn
  if (playerCollider.end.y < -50) {
    resetPlayer();
  }

  camera.position.copy(playerCollider.end);

}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  updatePlayer(dt);
  if (postProcessingSettings.postEnabled) {
    masterPostPass.uniforms.time.value += dt;
    updateGodRaySunPosition();
    composer.render();
  } else {
    renderer.render(scene, camera);
  }
}
animate();
</script>
