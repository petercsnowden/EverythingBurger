<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Everything Burger — 3D Experience</title>
<style>
  :root {
    --accent: #ff6031;
    --sky: #95D4F0;
    --ink: #00000060;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--ink);
    overflow: hidden;
    font-family: "Averia Serif Libre";
  }
  canvas { display: block; }

  #crosshair {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 6px;
    height: 6px;
    margin: -3px 0 0 -3px;
    border-radius: 50%;
    background: #fff;
    mix-blend-mode: difference;
    pointer-events: none;
    opacity: 0;
    transition: opacity .2s ease;
    z-index: 5;
  }
  #crosshair.visible { opacity: 0.9; }

  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--ink);
    z-index: 10;
    cursor: pointer;
    transition: opacity .35s ease;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }

  #overlay-card {
    text-align: center;
    color: #fff;
    max-width: 360px;
    padding: 0 24px;
  }
  #overlay-card h1 {
    font-size: 28px;
    margin: 0 0 12px;
    color: var(--accent);
    letter-spacing: -0.02em;
  }
  #overlay-card p {
    font-size: 15px;
    line-height: 1.5;
    margin: 6px 0;
    color: #ffffff;
  }
  #overlay-card .key {
    display: inline-block;
    padding: 2px 7px;
    border: 1px solid #555;
    border-radius: 4px;
    font-size: 13px;
    color: #fff;
    margin: 0 2px;
  }
  #enter-btn {
    margin-top: 22px;
    padding: 12px 28px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 999px;
    font-size: 30px;
    font-weight: 600;
    cursor: pointer;
    font-family: "Damsterdam"
  }
  #back-link {
    position: fixed;
    top: 18px;
    left: 18px;
    z-index: 8;
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    background: rgba(0,0,0,0.45);
    padding: 8px 14px;
    border-radius: 999px;
    backdrop-filter: blur(4px);
    opacity: 0;
    transition: opacity .3s ease;
  }
  #back-link.visible { opacity: 1; }

  #loading-bar-wrap {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    height: 3px;
    background: rgba(255,255,255,0.15);
    border-radius: 2px;
    overflow: hidden;
    z-index: 10;
  }
  #loading-bar {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width .2s ease;
  }
  #loading-label {
    position: fixed;
    bottom: 54px;
    left: 50%;
    transform: translateX(-50%);
    color: #888;
    font-size: 12px;
    z-index: 10;
  }

  #reset-hint {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.55);
    font-size: 12px;
    z-index: 8;
    opacity: 0;
    transition: opacity .3s ease;
  }
  #reset-hint.visible { opacity: 1; }
</style>
</head>
<body>

<a id="back-link" href="../index.html">&larr; Back</a>
<div id="crosshair"></div>
<div id="loading-label">Loading environment…</div>
<div id="loading-bar-wrap"><div id="loading-bar"></div></div>
<div id="reset-hint">Stuck? Press <b style="color:#fff">R</b> to reset your position</div>

<div id="overlay">
  <div id="overlay-card">
    <p>Move with <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span></p>
    <p>Look around with your mouse &middot; <span class="key">Space</span> to jump</p>
    <p>Press <span class="key">Esc</span> anytime to get your cursor back</p>
    <button id="enter-btn">Enter</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "three-mesh-bvh": "https://unpkg.com/three-mesh-bvh@0.9.14/build/index.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
import { Sky } from 'three/addons/objects/Sky.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { SSAOPass } from 'three/addons/postprocessing/SSAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import {
  MeshBVH,
  StaticGeometryGenerator,
  computeBoundsTree,
  disposeBoundsTree,
  acceleratedRaycast
} from 'three-mesh-bvh';

THREE.BufferGeometry.prototype.computeBoundsTree = computeBoundsTree;
THREE.BufferGeometry.prototype.disposeBoundsTree = disposeBoundsTree;
THREE.Mesh.prototype.raycast = acceleratedRaycast;

// ---------- CONFIG ----------
const MODEL_URL = '../assets/3d%20models/museumd2-optimized.glb';

// Where the player starts. Set well above the floor and let gravity +
// collision drop them onto real geometry — safer than guessing an exact
// floor height. Adjust x/z to taste; the model's main room sits roughly
// around x=-50, z=-3 in the source file.
const SPAWN_POSITION = new THREE.Vector3(-55, 15, -4);

// Objects that should collide (block the player) but never be rendered —
// e.g. an invisible perimeter wall. Set AFTER the collision mesh is built
// below, so the collider still bakes in their geometry; only their visual
// rendering is turned off.
const HIDDEN_COLLIDER_NAMES = ['plane021'];

const WALK_SPEED = 6.4;       // meters/second
const SPRINT_MULT = 1.8;
const CAPSULE_RADIUS = 0.35;
const CAPSULE_HEIGHT = 2.1;   // feet to top of head
const GRAVITY = 22;
const JUMP_SPEED = 7.2;
const STEP_HEIGHT = 0.3;      // max stair-riser height the player auto-climbs
// -----------------------------

const overlay = document.getElementById('overlay');
const enterBtn = document.getElementById('enter-btn');
const crosshair = document.getElementById('crosshair');
const backLink = document.getElementById('back-link');
const resetHint = document.getElementById('reset-hint');
const loadingBar = document.getElementById('loading-bar');
const loadingLabel = document.getElementById('loading-label');
const loadingWrap = document.getElementById('loading-bar-wrap');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.Fog(0x000000, 30, 50000);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 10000);
// near/far used to be 0.05/500 — a 10,000:1 ratio, far more range than a
// standard depth buffer can represent precisely. That precision loss is what
// let SSAO (and shadows) "see" geometry that should have been hidden behind
// walls. Fog already fades everything out by 110, so 130 gives a little
// headroom without reintroducing the precision problem. If your castle
// grounds are larger than that and you see things clipping at the edge of
// view, raise this number gradually and re-check for the wall/AO artifacts.

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap; // softer shadow edges
document.body.appendChild(renderer.domElement);

// Skip the pricier post-processing passes (AO, bloom) on phones/tablets so
// movement stays smooth there; they still get the environment reflections
// and the boosted lights/shadows below either way.
const isLikelyMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

const pmremGenerator = new THREE.PMREMGenerator(renderer);

scene.add(new THREE.HemisphereLight(0xbdd7ff, 0x2a2a2a, 1.1));

const sun = new THREE.DirectionalLight(0xffffff, 1.7);
sun.position.set(8, 10, 6);
sun.castShadow = true; // NOTE: this was never set before, so no shadows were
                        // actually being cast despite shadowMap being enabled
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0003;
sun.shadow.normalBias = 0.02;
// Shadow camera frustum — an orthographic box covering the lit area of the
// model. Widen/lengthen this (and near/far) if shadows clip near your walls.
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 80;
sun.shadow.camera.left = -40;
sun.shadow.camera.right = 40;
sun.shadow.camera.top = 40;
sun.shadow.camera.bottom = -40;
scene.add(sun);

// A DirectionalLight's shadow frustum is centered on its TARGET, which
// defaults to world origin (0,0,0) — not wherever your model actually sits.
// This model's real geometry is roughly 30-70 units away from the origin, so
// without this, the shadow camera was pointed at empty space and nothing
// was ever actually receiving a shadow. Aim it at the player's spawn area
// instead — that's where shadows actually matter.
sun.target.position.set(SPAWN_POSITION.x, 0, SPAWN_POSITION.z);
scene.add(sun.target);

// Soft, non-shadow-casting fill light from the opposite side, so the sun
// isn't the only thing carving out contrast — keeps shadowed areas from
// going flat black without costing another shadow map.
const fill = new THREE.DirectionalLight(0xcfe0ff, 0.5);
fill.position.set(-10, 6, -8);
scene.add(fill);

// ---------- Sky background + matching environment lighting ----------
// Baked once into a texture used for both the visible background and the
// IBL environment (ambient light + reflections), instead of adding an actual
// giant sky mesh into the live scene. A real sky mesh needs to be huge
// (hundreds of thousands of units) to look right, which would force the
// camera's far plane out to match — reintroducing exactly the depth-precision
// problem the near/far change above just fixed. Baking it offscreen avoids
// that entirely: the bake uses its own separate camera range that never
// touches the one your main scene renders with.
const skyProbeScene = new THREE.Scene();
const sky = new Sky();
sky.scale.setScalar(1000);
skyProbeScene.add(sky);

// Match the visible sky's sun direction to the DirectionalLight above so the
// shadows and the sky's bright spot agree with each other.
const sunDirection = sun.position.clone().normalize();
sky.material.uniforms['sunPosition'].value.copy(sunDirection);
sky.material.uniforms['turbidity'].value = .3;      // haze amount
sky.material.uniforms['rayleigh'].value = 0;      // blue intensity
sky.material.uniforms['mieCoefficient'].value = 0.006;
sky.material.uniforms['mieDirectionalG'].value = 0.8; // sun glare size

const skyEnvRT = pmremGenerator.fromScene(skyProbeScene, 0, 1, 5000);
scene.environment = skyEnvRT.texture;
scene.background = skyEnvRT.texture;
pmremGenerator.dispose();

const collisionObject = scene.getObjectByName('plane021');

if (collisionObject) {
    collisionObject.visible = false;

    // Keep using collisionObject for your collision calculations.
}

// Fog now fades toward the sky's horizon color instead of black, so distant
// geometry blends into the sky instead of vanishing into a dark wall.
scene.fog.color.set(0xbfd9ea);

// ---------- Point lights ----------
// Point lights that actually cast shadows (torches, lanterns, etc). Shadow-
// casting point lights are the most expensive light type (each renders the
// scene 6 times, once per cubemap face), so keep the count and mapSize
// modest and give each a `distance` cutoff so it doesn't light the whole
// level. Reposition/duplicate these for your own fixtures.
function addPointLight(position, { color = 0xffb066, intensity = 12, distance = 12, castShadow = true } = {}) {
  const light = new THREE.PointLight(color, intensity, distance, 2); // decay = 2 (physically-ish correct falloff)
  light.position.copy(position);
  if (castShadow) {
    light.castShadow = true;
    light.shadow.mapSize.set(1024, 1024);
    light.shadow.camera.near = 0.1;
    light.shadow.camera.far = distance;
    light.shadow.bias = -0.001;
  }
  scene.add(light);
  return light;
}

// Example placeholder lights near spawn — move these to your actual torch/
// lantern positions, and add more calls as needed. Y is a rough guess for
// now; it gets corrected against the real floor height once the model and
// its collision mesh are loaded, below.
const torchLight1 = addPointLight(new THREE.Vector3(SPAWN_POSITION.x + 3, SPAWN_POSITION.y - 6, SPAWN_POSITION.z + 2));
const torchLight2 = addPointLight(new THREE.Vector3(SPAWN_POSITION.x - 4, SPAWN_POSITION.y - 6, SPAWN_POSITION.z - 3), { color: 0x88aaff, intensity: 8 });
const TORCH_HEIGHT_ABOVE_FLOOR = 2.2; // lantern/sconce height once real floor Y is known

// ---------- Post-processing ----------
const composer = new EffectComposer(renderer);
composer.setPixelRatio(renderer.getPixelRatio());
composer.setSize(window.innerWidth, window.innerHeight);
composer.addPass(new RenderPass(scene, camera));

let ssaoPass = null;
let bloomPass = null;
if (!isLikelyMobile) {
  ssaoPass = new SSAOPass(scene, camera, window.innerWidth, window.innerHeight);
  ssaoPass.kernelRadius = 0.1;     // tune to your model's scale (meters)
  ssaoPass.minDistance = 0.0005;
  ssaoPass.maxDistance = 0.05;
  composer.addPass(ssaoPass);

  bloomPass = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    .5,  // strength — kept low; see threshold note below
    0.0,  // radius
    0.97   // threshold — this pass runs AFTER tone mapping is already baked
           // into the image (applied per-material during the render pass),
           // not on raw HDR values. Against an already-tonemapped image,
           // ordinary lit surfaces commonly sit at 0.5–0.9 brightness, so a
           // threshold of 0.85 caught almost everything — that was the
           // "everything is glowing" bug. 0.92 only catches genuinely bright
           // spots (windows, fixtures, the sun). Raise toward 1.0 for even
           // less spread, or lower it if you want more surfaces glowing.
  );
  composer.addPass(bloomPass);

//sound!

const listener = new THREE.AudioListener();
camera.add(listener);

const sound = new THREE.PositionalAudio(listener);
const audioLoader = new THREE.AudioLoader();
audioLoader.load('../../3d/jazz.mp3', (buffer) => {
  sound.setBuffer(buffer);
  sound.setDistanceModel('linear');
  sound.setRefDistance(10);
  sound.setMaxDistance(20);
  sound.setRolloffFactor(1);
  sound.setLoop(true);
  sound.play();
});
sound.position.set(-55, 15, -4);
scene.add(sound);
}

// Required as the last pass with EffectComposer, or tone mapping / color
// space conversion (set on the renderer above) won't be applied correctly.
composer.addPass(new OutputPass());

// ---------- Controls ----------
const controls = new PointerLockControls(camera, document.body);

const move = { forward: false, backward: false, left: false, right: false, sprint: false };
let wantsJump = false;

enterBtn.addEventListener('click', () => controls.lock());
overlay.addEventListener('click', (e) => { if (e.target === overlay) controls.lock(); });

controls.addEventListener('lock', () => {
  overlay.classList.add('hidden');
  crosshair.classList.add('visible');
  backLink.classList.remove('visible');
  resetHint.classList.add('visible');
});
controls.addEventListener('unlock', () => {
  overlay.classList.remove('hidden');
  crosshair.classList.remove('visible');
  backLink.classList.add('visible');
  resetHint.classList.remove('visible');
});

document.addEventListener('keydown', (e) => {
  switch (e.code) {
    case 'KeyW': case 'ArrowUp': move.forward = true; break;
    case 'KeyS': case 'ArrowDown': move.backward = true; break;
    case 'KeyA': case 'ArrowLeft': move.left = true; break;
    case 'KeyD': case 'ArrowRight': move.right = true; break;
    case 'ShiftLeft': case 'ShiftRight': move.sprint = true; break;
    case 'Space': wantsJump = true; break;
    case 'KeyR': resetPlayer(); break;
  }
});
document.addEventListener('keyup', (e) => {
  switch (e.code) {
    case 'KeyW': case 'ArrowUp': move.forward = false; break;
    case 'KeyS': case 'ArrowDown': move.backward = false; break;
    case 'KeyA': case 'ArrowLeft': move.left = false; break;
    case 'KeyD': case 'ArrowRight': move.right = false; break;
    case 'ShiftLeft': case 'ShiftRight': move.sprint = false; break;
  }
});

// ---------- Player capsule ----------
// The capsule is a vertical line segment (start = feet, end = head) with a
// radius. We move this segment through the world, then push it back out of
// any triangle it overlaps in the collision mesh.
const playerCollider = new THREE.Line3(
  new THREE.Vector3(0, CAPSULE_RADIUS, 0),
  new THREE.Vector3(0, CAPSULE_HEIGHT - CAPSULE_RADIUS, 0)
);
const playerVelocity = new THREE.Vector3();
let playerOnGround = false;

function resetPlayer() {
  playerCollider.start.set(SPAWN_POSITION.x, SPAWN_POSITION.y + CAPSULE_RADIUS, SPAWN_POSITION.z);
  playerCollider.end.set(SPAWN_POSITION.x, SPAWN_POSITION.y + CAPSULE_HEIGHT - CAPSULE_RADIUS, SPAWN_POSITION.z);
  playerVelocity.set(0, 0, 0);
  camera.position.copy(playerCollider.end);
}
resetPlayer();

// ---------- Load model + build collision BVH ----------
let collider = null;

const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://unpkg.com/three@0.160.0/examples/jsm/libs/draco/');

const loader = new GLTFLoader();
loader.setDRACOLoader(dracoLoader);

loader.load(
  MODEL_URL,
  (gltf) => {
    const model = gltf.scene;
    model.updateMatrixWorld(true);

      gltf.scene.traverse((child) => {
    if (!child.isMesh) return;

    const geometry = child.geometry;

    if (geometry && geometry.index) {
        const faceCount = geometry.index.count / 3;

        if (faceCount === 98) {
            console.log("98-FACE OBJECT:", {
                name: child.name,
                faces: faceCount,
                object: child
            });
        }
    }
});

    model.traverse((child) => {
      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;

            // Plane.021 is visual-only — don't render or collide with it
        if (child.name === "Plane021") {
            child.visible = false;
            return;

               collisionMeshes.push(child);
        }
      }
    });
    scene.add(model);

    // Merge every mesh in the scene into one static collision geometry and
    // build a BVH over it, so the player can collide with everything —
    // walls, floors, furniture, frames, all of it.
    try {
      const staticGen = new StaticGeometryGenerator(model);
      staticGen.attributes = ['position'];
      const mergedGeometry = staticGen.generate();
      mergedGeometry.boundsTree = new MeshBVH(mergedGeometry, { lazyGeneration: false });

      collider = new THREE.Mesh(mergedGeometry);
      collider.visible = false;
      scene.add(collider);

      // Hide the designated collider-only objects now that their geometry
      // is already baked into the merged collision mesh above — hiding them
      // any earlier could (depending on how StaticGeometryGenerator handles
      // visibility) leave them out of the collider entirely.
      HIDDEN_COLLIDER_NAMES.forEach((name) => {
        const obj = model.getObjectByName(name);
        if (obj) {
          obj.visible = false;
          console.log(`Hid "${name}" from rendering (still solid for collision).`);
        } else {
          console.warn(`HIDDEN_COLLIDER_NAMES: no object named "${name}" found in model.`);
        }
      });

      // Now that the real collision mesh exists, find the actual floor
      // height under spawn (rather than guessing) and use it to correct
      // the shadow target and torch light heights set as placeholders above.
      const floorRay = new THREE.Raycaster();
      floorRay.far = 1000;
      floorRay.set(
        new THREE.Vector3(SPAWN_POSITION.x, SPAWN_POSITION.y + 5, SPAWN_POSITION.z),
        new THREE.Vector3(0, -1, 0)
      );
      const floorHits = floorRay.intersectObject(collider, false);
      if (floorHits.length) {
        const floorY = floorHits[0].point.y;
        sun.target.position.y = floorY;
        torchLight1.position.y = floorY + TORCH_HEIGHT_ABOVE_FLOOR;
        torchLight2.position.y = floorY + TORCH_HEIGHT_ABOVE_FLOOR;
        console.log(`Real floor Y under spawn: ${floorY.toFixed(2)} — shadow target and torches corrected to match.`);
      } else {
        console.warn('Could not find real floor under SPAWN_POSITION for light correction — leaving placeholder heights.');
      }
    } catch (colliderErr) {
      console.error('Collision setup failed — walking through geometry until this is fixed:', colliderErr);
      loadingLabel.style.opacity = '1';
      loadingLabel.textContent = 'Loaded, but collision setup failed — check console.';
      loadingWrap.style.opacity = '0';
    }

    loadingWrap.style.opacity = '0';
    loadingLabel.style.opacity = '0';
  },
  (xhr) => {
    if (xhr.lengthComputable) {
      const pct = Math.round((xhr.loaded / xhr.total) * 100);
      loadingBar.style.width = pct + '%';
      loadingLabel.textContent = `Loading environment… ${pct}%`;
    }
  },
  (err) => {
    console.error('Failed to load model:', err);
    loadingLabel.textContent = 'Could not load environment — check the file path.';
  }
);

// ---------- Resize ----------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  if (ssaoPass) ssaoPass.setSize(window.innerWidth, window.innerHeight);
  if (bloomPass) bloomPass.setSize(window.innerWidth, window.innerHeight);
});

// ---------- Collision resolution ----------
const tempBox = new THREE.Box3();
const tempSegment = new THREE.Line3();
const tempVecA = new THREE.Vector3();
const tempVecB = new THREE.Vector3();
const tempVecC = new THREE.Vector3();

// Read-only probe: how deeply is the capsule currently overlapping geometry,
// at its CURRENT position? Doesn't move anything. Used by the step-up logic
// below to test "would raising the capsule clear this obstruction" without
// committing to it.
function maxPenetrationDepth() {
  if (!collider) return 0;

  tempBox.makeEmpty();
  tempBox.expandByPoint(playerCollider.start);
  tempBox.expandByPoint(playerCollider.end);
  tempBox.min.addScalar(-CAPSULE_RADIUS);
  tempBox.max.addScalar(CAPSULE_RADIUS);

  let deepest = 0;
  collider.geometry.boundsTree.shapecast({
    intersectsBounds: (box) => box.intersectsBox(tempBox),
    intersectsTriangle: (tri) => {
      const distance = tri.closestPointToSegment(playerCollider, tempVecA, tempVecB);
      if (distance < CAPSULE_RADIUS) {
        const depth = CAPSULE_RADIUS - distance;
        if (depth > deepest) deepest = depth;
      }
    }
  });
  return deepest;
}

// Apply horizontal input for this frame, auto-climbing low obstructions
// (stairs, curbs) instead of stopping dead against them. Only kicks in while
// grounded, so it never lets you "step up" through the air.
function applyHorizontalMove(moveVec) {
  if (moveVec.lengthSq() === 0) return;

  playerCollider.start.add(moveVec);
  playerCollider.end.add(moveVec);

  if (!playerOnGround || !collider) return;

  const depthAtCurrentHeight = maxPenetrationDepth();
  if (depthAtCurrentHeight <= 1e-4) return; // wasn't blocked, nothing to do

  // Blocked. Undo, retry the same move from STEP_HEIGHT higher up.
  playerCollider.start.sub(moveVec);
  playerCollider.end.sub(moveVec);
  playerCollider.start.y += STEP_HEIGHT;
  playerCollider.end.y += STEP_HEIGHT;
  playerCollider.start.add(moveVec);
  playerCollider.end.add(moveVec);

  const depthWhenRaised = maxPenetrationDepth();
  if (depthWhenRaised > 1e-4) {
    // Still blocked even up here — a real wall, not a step. Revert fully.
    playerCollider.start.sub(moveVec);
    playerCollider.end.sub(moveVec);
    playerCollider.start.y -= STEP_HEIGHT;
    playerCollider.end.y -= STEP_HEIGHT;
    return;
  }

  // Clear up here — leave the capsule raised. resolveCollisions(), called
  // right after this, will drop it back down onto the step and re-ground it.
}

function resolveCollisions() {
  if (!collider) return;

  let grounded = false;

  // Resolve one penetration at a time, rather than accumulating pushes from
  // every triangle in the model. Accumulating many triangle responses is what
  // causes the player to get "tossed" when meshes contain overlapping faces.
  for (let pass = 0; pass < 5; pass++) {
    tempBox.makeEmpty();
    tempBox.expandByPoint(playerCollider.start);
    tempBox.expandByPoint(playerCollider.end);
    tempBox.min.addScalar(-CAPSULE_RADIUS);
    tempBox.max.addScalar(CAPSULE_RADIUS);

    let deepestDepth = 0;
    let bestNormal = null;

    collider.geometry.boundsTree.shapecast({
      intersectsBounds: (box) => box.intersectsBox(tempBox),

      intersectsTriangle: (tri) => {
        const distance = tri.closestPointToSegment(
          playerCollider,
          tempVecA,
          tempVecB
        );

        if (distance < CAPSULE_RADIUS) {
          const depth = CAPSULE_RADIUS - distance;

          // Normal points from the triangle toward the player (capsule point
          // minus triangle point — NOT the other way around, or every push
          // shoves the player deeper into the surface instead of out of it).
          tempVecC.subVectors(tempVecB, tempVecA);

          let lenSq = tempVecC.lengthSq();

          // At exact contact the closest points can be identical. Use the
          // triangle normal instead of normalizing a zero-length vector.
          if (lenSq < 1e-10) {
            tri.getNormal(tempVecC);
            lenSq = tempVecC.lengthSq();
          }

          if (lenSq > 1e-10 && depth > deepestDepth) {
            tempVecC.multiplyScalar(1 / Math.sqrt(lenSq));
            deepestDepth = depth;
            bestNormal = tempVecC.clone();
          }
        }
      }
    });

    // Ignore sub-millimeter overlaps. Compressed/decimated geometry almost
    // always has tiny gaps or overlaps at seams between separate mesh
    // chunks; resolving those exactly every frame is what produces odd
    // micro-jitter against otherwise-flat walls.
    const MIN_PUSH_DEPTH = 0.0015;
    if (!bestNormal || deepestDepth <= MIN_PUSH_DEPTH) break;

    // Small safety margin prevents immediately re-colliding due to floating
    // point error without creating visible bouncing.
    const push = deepestDepth + 0.0005;
    playerCollider.start.addScaledVector(bestNormal, push);
    playerCollider.end.addScaledVector(bestNormal, push);

    // Remove only velocity INTO the surface. Do not add any velocity from
    // the collision itself, which prevents walls/furniture from launching
    // the player.
    const velocityIntoSurface = playerVelocity.dot(bestNormal);
    if (velocityIntoSurface < 0) {
      playerVelocity.addScaledVector(bestNormal, -velocityIntoSurface);
    }

    // A mostly-upward collision is the floor.
    if (bestNormal.y > 0.55) {
      grounded = true;
      if (playerVelocity.y < 0) playerVelocity.y = 0;
    }
  }

  playerOnGround = grounded;
}

// ---------- Movement loop ----------
const clock = new THREE.Clock();
const forwardVec = new THREE.Vector3();
const rightVec = new THREE.Vector3();
const moveVec = new THREE.Vector3();

function updatePlayer(dt) {
  // Horizontal movement here is driven directly by input (added straight to
  // position below), not by velocity/inertia — playerVelocity should only
  // ever hold vertical (gravity/jump) speed. But resolveCollisions()'s
  // "cancel velocity into the surface" step can leak a bit of x/z into it
  // whenever a floor triangle isn't perfectly flat (always true to some
  // degree on real/compressed geometry). Left unchecked, that leaked
  // velocity gets added to position every frame after and never goes away —
  // that's the slow drift. Clear it before this frame's integration.
  playerVelocity.x = 0;
  playerVelocity.z = 0;

  // Gravity
  if (!playerOnGround) {
    playerVelocity.y -= GRAVITY * dt;
  } else if (playerVelocity.y < 0) {
    playerVelocity.y = 0;
  }
  if (wantsJump && playerOnGround) {
    playerVelocity.y = JUMP_SPEED;
    playerOnGround = false;
  }
  wantsJump = false;

  playerCollider.start.addScaledVector(playerVelocity, dt);
  playerCollider.end.addScaledVector(playerVelocity, dt);

  // Horizontal input, relative to camera yaw
  if (controls.isLocked) {
    const speed = WALK_SPEED * (move.sprint ? SPRINT_MULT : 1);

    camera.getWorldDirection(forwardVec);
    forwardVec.y = 0;
    forwardVec.normalize();
    rightVec.crossVectors(forwardVec, camera.up).normalize();

    moveVec.set(0, 0, 0);
    if (move.forward) moveVec.add(forwardVec);
    if (move.backward) moveVec.sub(forwardVec);
    if (move.right) moveVec.add(rightVec);
    if (move.left) moveVec.sub(rightVec);
    if (moveVec.lengthSq() > 0) moveVec.normalize().multiplyScalar(speed * dt);

    applyHorizontalMove(moveVec);
  }

  // Push the capsule out of any geometry it now overlaps.
  // The resolver also removes velocity directed into the surface, preventing
  // collision normals from turning into launch/toss impulses.
  resolveCollisions();

  // Fell out of the world — send back to spawn
  if (playerCollider.end.y < -50) {
    resetPlayer();
  }

  camera.position.copy(playerCollider.end);

}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  updatePlayer(dt);
  composer.render();
}
animate();
</script>
