<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="cart.css">
    <link rel="stylesheet" href="../shop-chrome.css">
    <link rel="stylesheet" href="../../nav.css">
    <link rel="icon" type="image/webp" href="../../assets/images/favicon 3.webp" sizes="32x32">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Everything Burger</title>
</head>
<body>
    <a class="shop-back" href="../shop.html">Back</a>

    <div class="shop-toolbar">
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-menu" aria-label="Open menu">
            <img src="../../assets/images/BurgerIcon.webp" alt="">
        </button>
        <a class="shop-cart" href="../shop.html">Shop</a>
    </div>

    <main class="cart-page">
        <div class="cart-canvas">
            <section class="cart-hero">
                <header class="cart-header">
                    <h1 class="cart-title">Your Cart</h1>
                </header>

                <div class="cart-list" data-cart-list></div>

                <div class="cart-summary" data-cart-summary hidden>
                    <p class="cart-subtotal">Subtotal: <span data-cart-subtotal>$0.00</span></p>
                    <button type="button" class="cart-checkout" data-checkout>
                        <span class="cart-checkout__label">Checkout</span>
                    </button>
                    <p class="cart-checkout__stripe">
                        <svg class="cart-checkout__stripe-logo" viewBox="0 0 24 24" aria-hidden="true">
                            <path fill="#635bff" d="M13.976 9.15c-2.172-.806-3.356-1.426-3.356-2.409 0-.831.683-1.305 1.901-1.305 2.227 0 4.515.858 6.09 1.631l.89-5.494C18.252.975 15.697 0 12.165 0 9.667 0 7.589.654 6.104 1.872 4.56 3.147 3.757 4.992 3.757 7.218c0 4.039 2.467 5.76 6.476 7.219 2.585.92 3.445 1.574 3.445 2.583 0 .98-.84 1.545-2.354 1.545-1.875 0-4.965-.921-6.99-2.109l-.9 5.555C5.175 22.99 8.385 24 11.714 24c2.641 0 4.843-.624 6.328-1.813 1.664-1.305 2.525-3.236 2.525-5.732 0-4.128-2.524-5.851-6.591-7.305z"/>
                        </svg>
                        Powered by Stripe
                    </p>
                </div>

                <p class="cart-checkout-error" data-checkout-error hidden></p>
            </section>

            <div class="shop-divider" aria-hidden="true">
                <img
                    class="shop-divider__swiggle"
                    src="../../assets/images/SwiggleEnd.webp"
                    alt=""
                >
            </div>

            <div class="shop-footer-wrap">
                <footer class="site-footer">
                    <h2 class="site-footer__title">Contact</h2>
                    <div class="site-footer__info-row">
                        <div class="site-footer__details">
                            <p>petercsnowden@gmail.com</p>
                            <p>@peter.c.snowden </p>
                            <p>(731) 803-8263</p>
                        </div>
                        <div class="site-footer__circles" aria-hidden="true">
                            <svg viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="88" cy="30" r="26" fill="#FF6031"/>
                                <circle cx="58" cy="40" r="24" fill="#95D4F0"/>
                                <circle cx="32" cy="50" r="22" fill="#000000"/>
                            </svg>
                        </div>
                    </div>
                    <a class="site-footer__guestbook" href="https://everythingburger.atabook.org/">Guest Book</a>
                    <div class="site-footer__socials">
                        <a class="social-btn" href="https://instagram.com/peter.c.snowden" target="_blank" rel="noopener">
                            <img src="../../assets/images/InstagramIcon.webp" alt="Instagram">
                        </a>
                        <a class="social-btn" href="https://www.youtube.com/@UnstableSmiles" target="_blank" rel="noopener">
                            <img src="../../assets/images/YoutubeIcon.webp" alt="YouTube">
                        </a>
                        <a class="social-btn" href="https://letterboxd.com/smilie/" target="_blank" rel="noopener">
                            <img src="../../assets/images/LetterboxdIcon.webp" alt="Letterboxd">
                        </a>
                    </div>
                </footer>
                <img
                    class="shop-brand"
                    src="../../assets/images/EverythingBurgerText.svg"
                    alt="Everything Burger"
                >
            </div>
        </div>
    </main>

    <script src="../../nav.js?v=20260924b"></script>
    <script src="../shirts/shirts-catalog.js"></script>
    <script src="../shirts/shirts-data.js"></script>
    <script src="../prints/prints-data.js"></script>
    <script src="../more/more-data.js"></script>
    <script src="../js/shop-data.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/stripe-checkout.js"></script>
    <script src="../js/cart-page.js"></script>
</body>
</html>
